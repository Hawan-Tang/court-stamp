#boot img{width:96px;height:96px;border-radius:24px;animation:bootb 1.2s ease-in-out infinite}
#boot .bar{width:min(56vw,220px);height:8px;border-radius:8px;background:rgba(108,92,231,.16);overflow:hidden}
#boot .bar i{display:block;height:100%;background:#6C5CE7;border-radius:8px;transform-origin:0 50%;transform:scaleX(0);transition:transform .25s ease-out}
#boot.done{opacity:0;pointer-events:none}
@keyframes bootb{50%{transform:translateY(-8px)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #boot{background:#141418}:root:not([data-theme="light"]) #boot .bar{background:rgba(139,124,246,.2)}:root:not([data-theme="light"]) #boot .bar i{background:#8B7CF6}}

<script>
/* 開啟畫面：下載題庫時顯示進度條，載完才跑主程式 */
// 背景發現新版：還沒開始答題就直接重新整理
try { if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (e) { if (e.data === 'updated' && !document.body.classList.contains('playing')) location.reload(); }); } catch (e) {}
(function () {
  var V = '31', files = [['js/data.js', 1589295], ['js/laws.js', 596875], ['js/why.js', 790000], ['js/plain.js', 600000], ['js/chars.js', 12175], ['js/app.js', 92000]];
  window.APP_V = V;
  var got = files.map(function () { return 0; }), txt = [], left = files.length, t0 = Date.now(), shown = 0, bar = document.getElementById('bootbar');
  var total = files.reduce(function (a, f) { return a + f[1]; }, 0);
  function paint() {
    var real = got.reduce(function (a, b) { return a + b; }, 0) / total;
    var fake = 1 - Math.exp(-(Date.now() - t0) / 2500);           // 拿不到大小時也會慢慢往前
    shown = Math.max(shown, Math.min(.97, Math.max(real, fake * .9)));
    bar.style.transform = 'scaleX(' + shown + ')';
    if (left) requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);
  function run() {
    txt.forEach(function (t) { var s = document.createElement('script'); s.text = t; document.body.appendChild(s); });
    bar.style.transform = 'scaleX(1)';
    var b = document.getElementById('boot'); b.classList.add('done'); setTimeout(function () { b.remove(); }, 400);
  }
  function fallback() { // 讀取失敗就改用一般方式載入
    var i = 0; (function nx() { if (i >= files.length) { document.getElementById('boot').remove(); return; } var s = document.createElement('script'); s.src = files[i++][0] + '?v=' + V; s.onload = s.onerror = nx; document.body.appendChild(s); })();
  }
  var failed = false;
  files.forEach(function (f, i) {
    var x = new XMLHttpRequest(); x.open('GET', f[0] + '?v=' + V);
    x.onprogress = function (e) { got[i] = Math.min(f[1], e.lengthComputable && e.total ? e.loaded / e.total * f[1] : e.loaded); };
    x.onload = function () {
      if (failed) return;
      if (x.status !== 200 && x.status !== 0) { failed = true; left = 0; fallback(); return; }
      got[i] = f[1]; txt[i] = x.responseText; if (!--left) run();
    };
    x.onerror = function () { if (!failed) { failed = true; left = 0; fallback(); } };
    x.send();
  });
})();
</script>
